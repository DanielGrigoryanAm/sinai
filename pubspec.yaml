name: sinai
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  auto_route: ^11.0.0
  intl_phone_field: ^3.2.0
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_core: ^4.2.1
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  sensors_plus: ^6.1.1
  flutter_slidable: ^4.0.1
  shared_preferences: ^2.5.6
  share_plus: ^13.3.1
  google_fonts: ^8.0.0
  firebase_messaging: ^16.7.1
  firebase_storage: ^13.6.1
  image_picker: ^1.2.4
  gal: ^3.0.0
  cached_network_image: ^4.0.7


dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  auto_route_generator: ^10.0.1
  flutter_gen_runner: ^5.10.0
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/mountain_resized.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

flutter_gen:
  output: lib/gen/
  line_length: 80
  assets:
    enabled: true
  integrations:
    flutter_svg: true
