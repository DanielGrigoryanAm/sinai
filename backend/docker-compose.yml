# Local services for the backend. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sinai
      POSTGRES_PASSWORD: sinai
      POSTGRES_DB: sinai
    ports: ["5432:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinai"]
      interval: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # S3-compatible storage for photos and voice messages, on port 8333.
  # MinIO no longer publishes free images, so SeaweedFS stands in locally;
  # production can use any S3 service (Cloudflare R2, AWS S3, ...).
  storage:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data
    ports: ["8333:8333"]
    volumes: [storage:/data]

volumes:
  postgres:
  storage:
