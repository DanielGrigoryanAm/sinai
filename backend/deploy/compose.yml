# Production stack on one server: the API behind Caddy (automatic HTTPS),
# Postgres and Redis on a private network, and nightly database backups.
# Media lives in Cloudflare R2, not here.
#
# Run from this folder on the server: docker compose up -d --build

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]

  api:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://sinai:${POSTGRES_PASSWORD}@postgres:5432/sinai?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE:+/secrets/fcm.json}
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sinai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sinai
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinai"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Only presence and fan-out live here; nothing to keep on disk.
    command: redis-server --save "" --appendonly no

  # Dumps the database every night and keeps the last 14 days in
  # ./backups. See DEPLOY.md for copying them off the server.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
    depends_on:
      postgres: {condition: service_healthy}
    entrypoint: ["/bin/sh", "/backup.sh"]

volumes:
  postgres:
  caddy-data:
  caddy-config:
